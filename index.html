<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Earthwork</title>
  </head>
  <body>
    <div id="map"></div>
    <aside class="ew-panel">
      <h1>Earthwork</h1>
      <p class="ew-lede">
        The chance the ground was dug, filled or graded between two years, from AlphaEarth, scored on
        your GPU for every 10 m pixel.
      </p>
      <div class="ew-row">
        <label>From <select id="first"></select></label>
        <label>to <select id="last"></select></label>
      </div>
      <div class="ew-row ew-models">
        <button data-model="current">Current</button>
        <button data-model="abroad">Ex-US</button>
        <span class="ew-key">M</span>
      </div>
      <p id="model-note" class="ew-note"></p>
      <div class="ew-ramp"><span>0</span><i></i><span>1</span></div>
      <p id="status" class="ew-status"></p>
    </aside>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
