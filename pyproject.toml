[project]
name = "aef-tessera-earthwork"
version = "0.1.0"
description = "Earthwork with a second embedding: does TESSERA see the ground lidar says moved, and does it agree with AlphaEarth?"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "duckdb>=1.5.6",
    "geotessera>=0.11.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "obstore>=0.9.2",
    "pyproj>=3.8.0",
    "rasterio>=1.5.2",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "zarr>=3.1",
]

[tool.uv]
package = false
